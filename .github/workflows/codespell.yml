name: Codespell

on:
  workflow_call:
    secrets:
      CHECKOUT_TOKEN:
        required: false
        description: >
          The GitHub token to authenticate checkout with. Pass in a GitHub personal access token if authenticated
          submodules are used.

    inputs:
      cancel-workflow-on-failure:
        description: When set to "true", it will cancel the current workflow run with all jobs if this workflow fails.
        type: string
        default: 'true'

jobs:
  codespell:
    name: Codespell
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: Lombiq/GitHub-Actions/.github/actions/checkout@snapshot/dotnet8
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Run codespell
        uses: Lombiq/GitHub-Actions/.github/actions/codespell@snapshot/dotnet8

      - name: Cancel Workflow on Failure
        if: failure() && inputs.cancel-workflow-on-failure == 'true'
        uses: Lombiq/GitHub-Actions/.github/actions/cancel-workflow@snapshot/dotnet8
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
