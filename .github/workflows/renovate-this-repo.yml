# We can't use the Renovate GitHub App due to its restrictions on postUpgradeTasks commands, so need to do self-hosting.
name: Renovate

on:
  # Run manually.
  workflow_dispatch:
  # Run every Thursday at 4:00 AM.
  schedule:
    - cron: 0 4 * * 4
  # Run on pushes to dev when the Renovate configuration changes.
  push:
    branches:
      - dev

jobs:
  renovate:
    name: Renovate
    uses: Lombiq/GitHub-Actions-Renovate-Test/.github/workflows/renovate.yml@dev
    secrets:
      CHECKOUT_TOKEN: ${{ secrets.LOMBIQBOT_GITHUB_PERSONAL_ACCESS_TOKEN }}
