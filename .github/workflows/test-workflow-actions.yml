name: Test Workflow Actions

on:
  workflow_call:
    secrets:
      ENVIRONMENT_VARIABLES_JSON:
        required: false
  pull_request:
  push:
    branches: [dev]

permissions:
  contents: read
  actions: read

jobs:
  test:
    name: Test Workflow Actions
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Collect Workflow Telemetry
        uses: ./.github/actions/workflow-telemetry
        with:
          interval_seconds: '1'

      - name: Set Environment Variables
        uses: ./.github/actions/set-environment-variables
        env:
          ENVIRONMENT_VARIABLES_JSON: ${{ secrets.ENVIRONMENT_VARIABLES_JSON }}

      - name: Verify Nested Secret
        shell: pwsh
        env:
          ENVIRONMENT_VARIABLES_JSON: ${{ secrets.ENVIRONMENT_VARIABLES_JSON }}
        run: |
          if ($Env:ENVIRONMENT_VARIABLES_JSON)
          {
              if ($Env:ENVIRONMENT_VARIABLES_JSON.Contains("`n") -or $Env:ENVIRONMENT_VARIABLES_JSON.Contains("`r"))
              {
                  throw 'The JSON secret must reach the nested workflow as a single line.'
              }

              if ($Env:TELEMETRY_TEST_SECRET -ne 'telemetry-mask-regression' -or
                  $Env:TELEMETRY_TEST_ENVIRONMENT -ne 'production')
              {
                  throw 'The environment variables were not preserved through the nested workflow call.'
              }

              # Inspect the run log: the synthetic credential must be masked, while chart syntax stays intact.
              Write-Output "Synthetic credential: $Env:TELEMETRY_TEST_SECRET"
              Write-Output 'Telemetry syntax: {}'
          }

      - name: Test Label Updates
        shell: pwsh
        run: ./.github/actions/add-remove-label/Test-UpdateLabels.ps1

      - name: Generate Metrics
        shell: pwsh
        run: |
          $values = 1..100000 | ForEach-Object { [Math]::Sqrt($_) }
          Write-Output "Calculated $($values.Count) values."
          Start-Sleep -Seconds 5
