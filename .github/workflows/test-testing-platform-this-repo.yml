name: Test Microsoft Testing Platform Integration

on:
  pull_request:
    paths:
      - .github/actions/test-dotnet/**
      - .github/workflows/test-testing-platform-this-repo.yml
  push:
    branches: [dev]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: Lombiq/GitHub-Actions/.github/actions/checkout@issue/OSOE-1308

      - name: Setup .NET
        uses: Lombiq/GitHub-Actions/.github/actions/setup-dotnet@issue/OSOE-1308

      - name: Test MTP Integration
        shell: pwsh
        run: ./.github/actions/test-dotnet/Tests/Invoke-Tests.ps1
