name: Lint Scripts, Styles, and Texts

on:
  workflow_call:
    secrets:
      CHECKOUT_TOKEN:
        required: false
        description: >
          The GitHub token to authenticate checkout with. Pass in a GitHub personal access token if authenticated
          submodules are used.

    inputs:
      cancel-workflow-on-failure:
        description: When set to "true", it will cancel the current workflow run with all jobs if this workflow fails.
        type: string
        default: 'true'
      scripts:
        description: |
          Information about the projects where JavaScript linting should occur. Can be in two formats:
          - A comma separated list of relative paths to the project directories. These are the paths where a package.json
            file could be, if desired. If there is no package.json on the provided path, the default one from this
            repository is copied and the default asset subpath (./Assets/Scripts) is assumed. Using this approach, you have
            to copy the assets to their final path (in ./wwwroot) using a different method, for example using the Copy
            task in MSBuild.
          - JSON object where the property names are the relative paths to the project directory where the package.json
            file would be. For each path, a new package.json file is created from the template in this repository and then
            the value of the property is placed into the $.nodejsExtensions path in the project file.
        type: string
        default: ''
      styles:
        description: A comma-separated list of the project paths where CSS linting should occur.
        type: string
        default: ''
      lint-markdown:
        description: Indicates if Markdown files should be linted in this repository.
        type: string
        default: 'true'
      markdown-config:
        description: Path to a file to use for the base configuration object (defaults to "lombiq.markdownlint.json").
        type: string
        default: lombiq.markdownlint.json
      markdown-fix:
        description: Whether to fix issues automatically for the rules that support it (any truthy value enables).
        type: string
        default: ''
      markdown-globs:
        description: Glob expression(s) of files to lint (newline-delimited).
        type: string
        default: '**/*.{md,markdown}'
      markdown-separator:
        description: String to use as a separator for the "globs" input (defaults to newline).
        type: string
        default: \n

jobs:
  lint:
    name: Lint Scripts, Styles, and Texts
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: Lombiq/GitHub-Actions/.github/actions/checkout@dev
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up Node.js
        uses: Lombiq/GitHub-Actions/.github/actions/setup-node@dev

      - name: Lint Scripts and Styles
        uses: Lombiq/GitHub-Actions/.github/actions/asset-lint@issue/OSOE-1185
        with:
          scripts: ${{ inputs.scripts }}
          styles: ${{ inputs.styles }}

      - name: Markdown Linting
        if: inputs.lint-markdown == 'true'
        uses: Lombiq/GitHub-Actions/.github/actions/markdown-lint@issue/OSOE-1185
        with:
          config: ${{ inputs.markdown-config }}
          fix: ${{ inputs.markdown-fix }}
          globs: ${{ inputs.markdown-globs }}
          separator: ${{ inputs.markdown-separator }}

      - name: Cancel Workflow on Failure
        if: failure() && inputs.cancel-workflow-on-failure == 'true'
        uses: Lombiq/GitHub-Actions/.github/actions/cancel-workflow@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
