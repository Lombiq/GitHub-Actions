name: Deploy to Azure App Service

concurrency:
  group: ${{ inputs.app-name }}AzureWorkflow

on:
  workflow_call:
    secrets:
      CHECKOUT_TOKEN:
        required: false
        description: >
          The GitHub token to authenticate checkout with. Pass in a GitHub personal access token if authenticated
          submodules are used.

      # These secrets are for OpenID Connect-based authentication with Azure services through the azure/login action
      # (proxied by our login-to-azure action below). Check out its documentation on how these secrets are used:
      # https://github.com/azure/login.
      AZURE_APP_SERVICE_DEPLOYMENT_SERVICE_PRINCIPAL_ID:
        required: true
        description: >
          The Application (client) ID of the Azure Service Principal or Managed Credential, which will be mapped to the
          client-id parameter when calling azure/login.
      AZURE_APP_SERVICE_DEPLOYMENT_AZURE_TENANT_ID:
        required: true
        description: >
          The Tenant (Directory) ID of the Microsoft Entra ID tenant, which will be mapped to the tenant-id parameter
          when calling azure/login.
      AZURE_APP_SERVICE_DEPLOYMENT_AZURE_SUBSCRIPTION_ID:
        required: true
        description: >
          The ID of the Azure Subscription the resources are under, which will be mapped to the subscription-id
          parameter when calling azure/login. You can look this up e.g. in the Azure Portal under any resource or the
          subscription itself.

      AZURE_APP_SERVICE_PUBLISH_PROFILE:
        required: true

    inputs:
      cancel-workflow-on-failure:
        description: When set to "true", it will cancel the current workflow run with all jobs if this workflow fails.
        type: string
        default: 'false'
      machine-type:
        type: string
        default: ubuntu-24.04
        description: The name of the type of machine to run the workflow under.
      free-up-space:
        type: string
        default: 'false'
        description: >
          Frees up storage space on the runner by deleting files unnecessary for .NET projects. Since it takes time and
          can break prepared images, this is disabled by default. Enable it if the workflow fails with errors suggesting
          that the runner has insufficient storage space.
      dotnet-version:
        type: string
        default: 10.0.102
        description: Version of the .NET SDK to set up.
      node-version:
        type: string
        default: 24.10.0
        description: >
          The Node.js version. Can be a specific version number or other notations, see the documentation of
          https://github.com/actions/setup-node.
      node-package-manager-cache:
        type: string
        default: 'false'
        description: >
          Set to true to enable automatic caching based on the package manager field in package.json. By default,
          caching is disabled for this workflow (which is different from the underlying action's default behavior), to
          improve stability and backwards compatibility.
      enable-corepack:
        type: string
        default: 'false'
        description: Indicates whether to enable Node.js corepack before the build.
      build-directory:
        type: string
        default: .
        description: Path to the directory where a solution file can be found.
      build-configuration:
        type: string
        default: Release
        description: Configuration parameter for dotnet build, e.g. Release (default) or Debug.
      build-verbosity:
        type: string
        default: quiet
        description: Verbosity parameter for dotnet build.
      build-enable-code-analysis:
        type: string
        default: 'false'
        description: Indicates whether to enable static code analysis during dotnet build.
      build-enable-nuget-caching:
        type: string
        default: 'false'
        description: >
          If set to "true", the NuGet packages will be cached by GitHub. This is faster if you have a lot of NuGet
          packages, but negligible or even slower if you only have a handful. When run on BuildJet, it will use the
          BuildJet cache instead of GitHub's, which is faster.
      build-enable-npm-caching:
        type: string
        default: 'false'
        description: >
          If set to "true", the NPM packages will be cached by GitHub. This is faster if you have a lot of NPM packages,
          packages, but negligible or even slower if you only have a handful. When run on BuildJet, it will use the
          BuildJet cache instead of GitHub's, which is faster.
      build-cache-version:
        type: string
        default: '0'
        description: >
          Change this to any other value to alter the cache key, effectively invalidating the latest cache. This is an
          alternative to clearing the cache manually, see
          https://docs.github.com/en/actions/using-workflows/caching-dependencies-to-speed-up-workflows#managing-caches.
      build-warnings-as-errors:
        type: string
        default: 'true'
        description: >
          Whether compiler warnings should be treated as errors during the build process. The default value is "true",
          the compiler flag "-warnaserror" will be used, causing the build to fail if any warnings are generated. If set
          to "false", the flag "-warnaserror" will not be used, allowing warnings to be generated without causing the
          build to fail.
      build-rebuild-directory:
        type: string
        default: ''
        description: >
          If a path is provided, C# project files are searched and rebuilt inside that directory. This is to be
          considered a workaround for a build order problem, and should be avoided when possible.
      build-create-binary-log:
        type: string
        default: 'false'
        description: >
          Configures MSBuild to create a binary log. This is useful to inspect and debug builds. See
          https://github.com/dotnet/msbuild/blob/main/documentation/wiki/Binary-Log.md for details.
      build-timeout-minutes:
        type: number
        default: 0
        description: >
          The maximum time the for the "build-dotnet" action's "build" step and for this workflow's "publish" step in
          minutes. Can be useful in combination with "build-create-binary-log" if the build hangs. If set to zero (which
          is the default), then there is no timeout.
      timeout-minutes:
        type: number
        default: 360
        description: Configuration for the timeout-minutes parameter of the workflow. 360 is GitHub's default.
      app-name:
        required: true
        type: string
        description: What you see at the top of the blade on the Azure Portal. Can contain uppercase letters too.
      slot-name:
        required: true
        type: string
        description: >
          What you see at the top of the blade on the Azure Portal, when you open the slot, before the app name in
          parenthesis.
      resource-group-name:
        required: true
        type: string
        description: Name of the resource group.
      web-project-path:
        type: string
        default: ./src/*Web/*.Web.csproj
        description: >
          The path of the web project file to be processed. The value is given to PowerShell's `Get-ChildItem` cmdlet
          as-is, so grepping is still possible but a name with spaces must be escaped separately.
      runtime:
        type: string
        description: >
          Publishes the application for a given runtime. If you use this option, set "self-contained" to the desired
          value also. "self-contained" is "false" by default.
      self-contained:
        type: string
        default: 'false'
        description: >
          Publishes the .NET runtime with your application so the runtime doesn't need to be installed on the target
          machine.
      application-insights-resource-id:
        required: true
        type: string
        description: >
          ID of the Application Insights resource that the release annotation for the deployment should be added to.
          This can e.g. be looked up on the Azure Portal under the given AI resource's Overview page -> JSON View.
      ready-to-run:
        type: string
        default: 'false'
        description: >
          Compiles application assemblies as ReadyToRun (R2R) format. R2R is a form of ahead-of-time (AOT) compilation.
          If ready to run is set to `true` the `runtime` input is needed.
      tag-prefix:
        type: string
        default: staging
        required: false
        description: >
          The prefix to use for the tag. If not set, 'staging' will be used as the prefix. The tag will be in the
          format of "<prefix>/latest" and "<prefix>/<timestamp>". This is used for tracking what's deployed, where and
          when by tagging the deployed commit.
      publish-arguments:
        type: string
        default: 'false'
        description: Additional arguments passed to dotnet publish.
      publish-show-diagnostics:
        type: string
        default: 'false'
        description: Show diagnostic information while executing the "dotnet publish" command.
      skip-update-latest-tag:
        type: string
        default: 'false'
        description: If set to "true", the latests tags will not be updated.
      verify-orchard-core-url:
        type: string
        default: ''
        description: >
          If not empty, this URL will be checked for the "X-Powered-By" HTTP response header, which should have the
          value 'OrchardCore' to pass. This is performed at the end of the "test-web-app-slot" step.
      verify-orchard-core-delay-time-seconds:
        type: number
        default: 5
        description: >
          The wait time between failed access attempts when using "verify-orchard-core-url".

jobs:
  deploy:
    runs-on: ${{ inputs.machine-type }}
    name: Deploy to Azure App Service
    environment: ${{ inputs.slot-name }}
    defaults:
      run:
        shell: pwsh
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - name: Free up Space
        if: inputs.free-up-space == 'true'
        uses: Lombiq/GitHub-Actions/.github/actions/free-up-space-for-dotnet@dev

      - name: Checkout
        uses: Lombiq/GitHub-Actions/.github/actions/checkout@dev
        with:
          token: ${{ secrets.CHECKOUT_TOKEN }}

      - name: Set up .NET
        uses: Lombiq/GitHub-Actions/.github/actions/setup-dotnet@dev
        with:
          dotnet-version: ${{ inputs.dotnet-version }}

      - name: Set up Node.js
        uses: Lombiq/GitHub-Actions/.github/actions/setup-node@dev
        with:
          node-version: ${{ inputs.node-version }}
          package-manager-cache: ${{ inputs.node-package-manager-cache }}

      - name: Enable Node corepack
        if: inputs.enable-corepack == 'true'
        uses: Lombiq/GitHub-Actions/.github/actions/enable-corepack@dev

      # If runtime is defined, we need to add "--runtime=" to the string so it will be a valid build/publish option. The
      # "build-dotnet" action requires the additional switches to be in separate lines (even the parameters), but we can
      # take advantage of the dotnet CLI tolerating the usage of the equal sign.
      - name: Set up runtime option
        id: set-up-runtime-option
        if: ${{ inputs.runtime != '' }}
        run: |
          "runtime-option=--runtime=${{ inputs.runtime }}" >> $Env:GITHUB_OUTPUT

      - name: Build and Static Code Analysis
        uses: Lombiq/GitHub-Actions/.github/actions/build-dotnet@issue/NEST-608
        with:
          directory: ${{ inputs.build-directory }}
          configuration: ${{ inputs.build-configuration }}
          create-binary-log: ${{ inputs.build-create-binary-log }}
          verbosity: ${{ inputs.build-verbosity }}
          enable-code-analysis: ${{ inputs.build-enable-code-analysis }}
          enable-nuget-caching: ${{ inputs.build-enable-nuget-caching }}
          enable-npm-caching: ${{ inputs.build-enable-npm-caching }}
          cache-version: ${{ inputs.build-cache-version }}
          solution-or-project-path: ${{ inputs.web-project-path }}
          warnings-as-errors: ${{ inputs.build-warnings-as-errors }}
          # Arguments need to be separated into newlines: https://stackoverflow.com/a/59077879/16192320
          dotnet-build-switches: |
            --self-contained
            ${{ inputs.self-contained }}
            -p:PublishReadyToRun=${{ inputs.ready-to-run }}
            ${{ steps.set-up-runtime-option.outputs.runtime-option }}
            -p:AzureDeploy=true
            -p:AzureDeployStage=build
            -p:BuildVersionDisplay_BuildUrl=https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          rebuild-directory: ${{ inputs.build-rebuild-directory }}
          timeout-minutes: ${{ inputs.build-timeout-minutes }}

      - name: Publish
        run: |
          $projectFile = (Get-ChildItem ${{ inputs.web-project-path }}).FullName
          $block = {
              dotnet publish $args[0] `
                  --no-build `
                  --configuration ${{ inputs.build-configuration }} `
                  --output '${{ inputs.build-directory }}/Published' `
                  --verbosity ${{ inputs.build-verbosity }} `
                  --self-contained ${{ inputs.self-contained }} `
                  -p:PublishReadyToRun=${{ inputs.ready-to-run }} `
                  -p:AzureDeploy=true `
                  -p:AzureDeployStage=publish `
                  ${{ steps.set-up-runtime-option.outputs.runtime-option }} ${{ inputs.publish-arguments }}
          }

          Invoke-ScriptBlock `
              -TimeoutMinutes ${{ inputs.build-timeout-minutes }} `
              -Name "dotnet publish `"$projectFile`"" `
              -ScriptBlock $block `
              -ShowDiagnostics $${{ inputs.publish-show-diagnostics }}
              -ArgumentList @($projectFile)

      - name: Upload MSBuild Binary Log
        uses: Lombiq/GitHub-Actions/.github/actions/upload-artifact@dev
        if: (success() || failure()) && inputs.build-create-binary-log == 'true'
        with:
          name: build-binary-log-publish.binlog
          path: ${{ inputs.build-directory }}/build.binlog
          if-no-files-found: ignore
          retention-days: 14

      - name: Compress Publish Package
        run: |
          Compress-Archive -Path .\Published\* -DestinationPath .\Published.zip

      - name: Login to Azure
        uses: Lombiq/GitHub-Actions/.github/actions/login-to-azure@dev
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_APP_SERVICE_DEPLOYMENT_SERVICE_PRINCIPAL_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_APP_SERVICE_DEPLOYMENT_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_APP_SERVICE_DEPLOYMENT_AZURE_SUBSCRIPTION_ID }}

      - name: Initialize PowerShell modules
        uses: Lombiq/Infrastructure-Scripts/.github/actions/initialize@4a640861470f7674569af8331f4b6aa0f2fcfbd2 # dev

      - name: Stop Web App Slot
        run: |
          Stop-AzureWebAppSlot `
            -ResourceGroupName ${{ inputs.resource-group-name }} `
            -WebAppName ${{ inputs.app-name }} `
            -SlotName ${{ inputs.slot-name }}

      # With Linux App Services, this fails the first time despite the deployment actually successfully completing, see
      # https://github.com/Azure/webapps-deploy/issues/362. Quickly rerunning it below works around this.
      - name: Deploy to Azure App Service
        id: deploy-to-azure
        continue-on-error: true
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ inputs.app-name }}
          slot-name: ${{ inputs.slot-name }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: ${{ inputs.build-directory }}/Published.zip
          # For docs on the below configs see https://github.com/Azure/webapps-deploy/releases/tag/v3.0.0.
          type: zip
          restart: false
          clean: false

      - name: Deploy to Azure App Service (Retry)
        if: steps.deploy-to-azure.outcome == 'failure'
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: ${{ inputs.app-name }}
          slot-name: ${{ inputs.slot-name }}
          publish-profile: ${{ secrets.AZURE_APP_SERVICE_PUBLISH_PROFILE }}
          package: ${{ inputs.build-directory }}/Published.zip
          # For docs on the below configs see https://github.com/Azure/webapps-deploy/releases/tag/v3.0.0.
          type: zip
          restart: false
          clean: false

      - name: Create Timestamp
        id: create-timestamp
        uses: Lombiq/GitHub-Actions/.github/actions/create-timestamp@dev

      - name: Add Azure Application Insights Release Annotation
        uses: Lombiq/GitHub-Actions/.github/actions/add-azure-application-insights-release-annotation@dev
        with:
          release-name: 'Deploy #${{ github.run_number }} to ${{ inputs.slot-name }}'
          application-insights-resource-id: ${{ inputs.application-insights-resource-id }}
          timestamp: ${{ steps.create-timestamp.outputs.timestamp }}

      - name: Remove Old Latest Tags
        if: ${{ inputs.skip-update-latest-tag != 'true' }}
        uses: Lombiq/GitHub-Actions/.github/actions/remove-old-latest-tags@dev
        with:
          tag-prefix: ${{ inputs.tag-prefix }}

      - name: Tag Latest and Add Timestamp Tag
        if: ${{ inputs.skip-update-latest-tag != 'true' }}
        run: |
          git tag '${{ inputs.tag-prefix }}/latest'
          git push origin '${{ inputs.tag-prefix }}/latest'
          git tag '${{ inputs.tag-prefix }}/${{ steps.create-timestamp.outputs.timestamp-tag }}'
          git push origin '${{ inputs.tag-prefix }}/${{ steps.create-timestamp.outputs.timestamp-tag }}'

      - name: Start Web App Slot
        id: start-web-app-slot
        run: |
          Start-AzureWebAppSlot `
            -ResourceGroupName ${{ inputs.resource-group-name }} `
            -WebAppName ${{ inputs.app-name }} `
            -SlotName ${{ inputs.slot-name }}

      - name: Test Web App Slot
        id: test-web-app-slot
        run: |
          Test-AzureWebApp `
            -ResourceGroupName ${{ inputs.resource-group-name }} `
            -WebAppName ${{ inputs.app-name }} `
            -SlotName ${{ inputs.slot-name }}

          $verifyOrchardCoreUrl = '${{ inputs.verify-orchard-core-url }}'
          $verifyOrchardCoreDelayTimeSeconds = ${{ inputs.verify-orchard-core-delay-time-seconds }}
          if ($verifyOrchardCoreUrl)
          {
            for ($i = 0; $i -lt 5; $i += 1)
            {
              try
              {
                $response = Invoke-WebRequest $verifyOrchardCoreUrl -ErrorAction SilentlyContinue
                if ($response -and $response.Headers['X-Powered-By'] -eq 'OrchardCore')
                {
                  Write-Output "Successfully reached `"$verifyOrchardCoreUrl`" after $i tries."
                  exit 0
                }
              }
              catch
              {
                Write-Output $PSItem.Message
              }

              Write-Output "Attempt $($i + 1): Couldn't reach `"$verifyOrchardCoreUrl`". Retrying in $verifyOrchardCoreDelayTimeSeconds seconds..."

              Start-Sleep -Seconds $verifyOrchardCoreDelayTimeSeconds
            }

            Write-GitHub "Couldn't reach `"$verifyOrchardCoreUrl`"!"
            exit 1
          }

      - name: Display Startup Logs on Failure
        if: failure() && (steps.start-web-app-slot.outcome == 'failure' || steps.test-web-app-slot.outcome == 'failure')
        run: |
          az webapp log startup show `
            --resource-group ${{ inputs.resource-group-name }} `
            --name ${{ inputs.app-name }} `
            --slot ${{ inputs.slot-name }}

      - name: Display Container Logs on Failure
        if: failure() && (steps.start-web-app-slot.outcome == 'failure' || steps.test-web-app-slot.outcome == 'failure')
        run: |
          az container logs `
            --resource-group ${{ inputs.resource-group-name }} `
            --name ${{ inputs.app-name }} `

      - name: Cancel Workflow on Failure
        if: failure() && inputs.cancel-workflow-on-failure == 'true'
        uses: Lombiq/GitHub-Actions/.github/actions/cancel-workflow@dev
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
