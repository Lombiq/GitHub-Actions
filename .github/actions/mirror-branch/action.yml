name: Mirror branch
description: >
  Pushes the currently checked out branch to another repository.

inputs:
  push-username:
    description: >
      The name of the user whose credentials are used to push to the repository. Leave as default to use a PAT.
    default: PersonalAccessToken
  remote-host:
    description: The URL host of the target repository. Default is github.com.
    default: github.com
  remote-repository:
    description: The target repository path, e.g. 'Lombiq/Open-Source-Orchard-Core-Extensions'.
    required: true

runs:
  using: composite
  steps:
    - name: Mirror current branch to remote
      uses: yesolutions/mirror-action@1708f16cdb28634fd3ba10c5c79abc91f5578a14 # v0.7.0
      with:
        REMOTE: 'https://${{ inputs.remote-host }}/${{ inputs.remote-repository }}'
        GIT_USERNAME: ${{ inputs.push-username }}
        GIT_PASSWORD: ${{ env.PUSH_PASSWORD }}
        PUSH_ALL_REFS: 'false'
