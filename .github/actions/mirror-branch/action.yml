name: Mirror branch
description: >
  Pushes the currently checked out branch to another repository.

inputs:
  push-user-name:
    description: >
      The name of the user whose credentials are used to push to the repository. Leave as default to use a PAT.
    default: PersonalAccessToken
  remote-host:
    description: The URL host of the target repository. Default is github.com.
    default: github.com
  remote-repository:
    description: The target repository path, e.g. 'Lombiq/Open-Source-Orchard-Core-Extensions'.
    required: true

runs:
  using: composite
  steps:
    - name: Push current branch to remote
      shell: pwsh
      run: |
        if ('${{ inputs.remote-repository }}'.ToLower() -eq '${{ github.repository }}'.ToLower())
        {
          Write-Output 'Target repository is the current repository, nothing to do.'

          exit
        }

        git remote add target 'https://${{ inputs.push-user-name }}:${{ env.PUSH_PASSWORD }}@${{ inputs.remote-host }}/${{ inputs.remote-repository }}'
        Write-Output 'Target remote added.'

        $branchName = git rev-parse --abbrev-ref HEAD

        Write-Output "Fetching '$branchName' from target."
        git fetch target $branchName

        $push = $false
        if ($LASTEXITCODE -ne 0)
        {
          Write-Output "'$branchName' doesn't exist on target."

          $push = $true
        }
        elseif ($null -ne (git log target/$branchName..$branchName))
        {
          Write-Output "'$branchName' exists on target, but isn't up-to-date."

          $push = $true
        }
        else
        {
          Write-Output "'$branchName' is up-to-date on target."
        }

        if ($push)
        {
          git push target

          Write-Output "Pushed '$branchName' to target."
        }

        if ($LASTEXITCODE -ne 0)
        {
          exit $LASTEXITCODE
        }

        git remote rm target
        Write-Output 'Target remote removed.'
