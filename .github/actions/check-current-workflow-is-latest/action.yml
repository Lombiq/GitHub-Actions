name: Check Current Workflow is the Latest Workflow
description: >
  Checks whether the current workflow is the most recent workflow for the pull request. Intentionally not documented in
  Actions.md since it's only meant for internal use.

inputs:
  current-workflow-id:
    description: The current workflow run's database id.
    required: true
    default: ''

outputs:
  is-latest:
    description: A boolean value indicating whether the current workflow is the most recent one.
    value: ${{ steps.check-current-workflow-equals-latest.outputs.is-latest }}

runs:
  using: composite
  steps:
    - name: Setup Scripts
      shell: pwsh
      run: |
        (Resolve-Path '${{ github.action_path }}/../../../Scripts').Path >> $Env:GITHUB_PATH

    - name: Check Current Workflow Equals Latest
      shell: pwsh
      id: check-current-workflow-equals-latest
      run: |
        $listSwitches = @(
          '--repo', '${{ github.repository }}'
          '--branch', '${{ github.head_ref }}'
          '--workflow', '${{ github.workflow }}'
          '--limit', '1'
          '--json', 'databaseId'
        )
        # The run list can transiently come back empty (GitHub API hiccup), so retry and don't index into null.
        $latestWorkflowRunDatabaseId = $null
        foreach ($attempt in 1..3)
        {
            $runs = @(gh run list @listSwitches | ConvertFrom-Json)
            if ($runs.Count -gt 0)
            {
                $latestWorkflowRunDatabaseId = $runs[0].databaseId
                break
            }

            Start-Sleep -Seconds 5
        }

        if ($null -eq $latestWorkflowRunDatabaseId)
        {
            # The current run exists, so an empty list is an API problem, not proof that a newer run exists.
            Write-Warning 'No workflow runs were returned, assuming the current workflow is the latest.'
            $currentEqualsLatest = $true
        }
        else
        {
            $currentEqualsLatest = ($latestWorkflowRunDatabaseId -eq ${{ inputs.current-workflow-id }})
        }

        Set-GitHubOutput 'is-latest' $currentEqualsLatest
