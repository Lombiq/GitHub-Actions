name: Mirror branch
description: Mirrors branches from a repository to another.

inputs:
  source-repository:
    description: >
      The repository's path, e.g. 'Lombiq/GitHub-Actions', to mirror branches from. Override this parameter if it
      differs from the repository running the workflow, or when you wish to check out a repository different from the
      current one.
    default: ${{ github.repository }}
  source-token:
    description: Optional PAT to fetch the source repository's branches from the GitHub API and for checkout.
    default: ${{ github.token }}
  checkout:
    description: >
      Set to 'false' if the source repository is already checked out with history (not shallow clone). Leaving it on the
      default value ('true') makes the 'source-repository' parameter required.
    default: 'true'
  destination-repository:
    description: The destination repository path, e.g. 'Lombiq/GitHub-Actions'.
    required: true
  destination-token:
    description: >
      Required PAT to fetch the destination repository's branches and to push to it.
    required: true
  branch-names:
    description: >
      A space-separated list of branch names to push to the destination repository. Use this parameter when the names of
      the branches that are outdated on the destination are known and doesn't need to be checked, e.g. when the workflow
      is triggered by the push event in the source repository. This parameter takes precedence over 'branch-names' when
      not empty.
  branch-regex:
    description: >
      A regex to match the branches of the source repository. Matched branches will be checked against the destination
      repository to determine if the head commit hashes differ to prevent unnecessary push operations. Default value
      matches any branch.
    default: '.+'

runs:
  using: composite
  steps:
    - name: Parameter validation
      shell: pwsh
      run: |
        if (-not '${{ inputs.branch-names }}' -and -not '${{ inputs.branch-regex }}')
        {
          throw 'At least one of the ''branch-names'' and ''branch-regex'' parameters must be non-empty.'
        }

        if (-not '${{ inputs.branch-names }}' -and -not '${{ inputs.source-repository }}')
        {
          throw 'The ''branch-regex'' parameter used, so the source repository path must be provided too.'
        }

        if ('${{ inputs.checkout }}' -eq 'true' -and -not '${{ inputs.source-repository }}' -match '^[^/]+/[^/]+$')
        {
          throw 'Checkout is enabled, so a valid source repository path must be provided too.'
        }

        if ('${{ inputs.source-repository }}'.ToLower() -eq '${{ inputs.destination-repository }}'.ToLower())
        {
          throw 'The source and the destination repositories cannot be the same.'
        }

    - name: Setup Scripts
      shell: pwsh
      run: |
        '${{ github.action_path }}' >> $Env:GITHUB_PATH
        (Resolve-Path '${{ github.action_path }}/../../../Scripts').Path >> $Env:GITHUB_PATH

    - name: Get source branches
      id: get-source-branches
      if: inputs.branch-names == ''
      uses: Lombiq/GitHub-Actions/.github/actions/get-branches@issue/OSOE-737
      with:
        repository: ${{ inputs.source-repository }}
        api-token: ${{ inputs.source-token }}

    - name: Get destination branches
      id: get-destination-branches
      if: inputs.branch-names == ''
      uses: Lombiq/GitHub-Actions/.github/actions/get-branches@issue/OSOE-737
      with:
        repository: ${{ inputs.destination-repository }}
        api-token: ${{ inputs.destination-token }}

    - name: Find branches to mirror
      id: find-branches
      shell: pwsh
      run: |
        $branchNames = '${{ inputs.branch-names }}'
        $branchRegex = '${{ inputs.branch-regex }}'

        if (-not $branchNames)
        {
          $sourceBranchHashes = [System.Collections.Generic.Dictionary[string, string]]::new()
          $destinationBranchHashes = [System.Collections.Generic.Dictionary[string, string]]::new()

          '${{ steps.get-source-branches.outputs.branches }}' | ConvertFrom-Json |
            ForEach-Object { $sourceBranchHashes[$PSItem.name] = $PSItem.commit.sha }

          if ($sourceBranchHashes.Count -eq 0)
          {
            Write-Output '::error::Source repository ''${{ inputs.source-repository }}'' has no branches!'
            exit 1
          }

          $matchingSourceBranchNames = $sourceBranchHashes.Keys | Where-Object { $PSItem -match $branchRegex }
          if ($matchingSourceBranchNames.Count -gt 0)
          {
            Write-Output ("::notice::Found $($matchingSourceBranchNames.Count) branches in '${{ inputs.source-repository }}' matching " +
              "'$branchRegex': " + ($matchingSourceBranchNames -join ', '))
          }
          else
          {
            Write-Output "::error::There are no branches in '${{ inputs.source-repository }}' matching '$branchRegex'!"
            exit 1
          }

          '${{ steps.get-destination-branches.outputs.branches }}' | ConvertFrom-Json |
            ForEach-Object { $destinationBranchHashes[$PSItem.name] = $PSItem.commit.sha }

          $mirroringBranchNames = @()
          foreach ($branch in $matchingSourceBranchNames)
          {
              if (-not $destinationBranchHashes.ContainsKey($branch) -or $sourceBranchHashes[$branch] -ne $destinationBranchHashes[$branch])
              {
                $mirroringBranchNames += $branch
              }
          }

          if ($mirroringBranchNames.Count -gt 0)
          {
            $branchNames = $mirroringBranchNames -join ', '
            Write-Output ("::notice::Found $($mirroringBranchNames.Count) branches in '${{ inputs.destination-repository }}' to be updated: " +
              $branchNames)
          }
          else
          {
            Write-Output '::notice::All the matched branches are up-to-date in ''${{ inputs.destination-repository }}''.'
          }
        }

        Set-GitHubOutput 'first-branch-name' ($branchNames -split ', ')[0]
        Set-GitHubOutput 'branch-names' $branchNames

    - name: Checkout source repository
      if: inputs.checkout == 'true' && steps.find-branches.outputs.first-branch-name != ''
      uses: Lombiq/GitHub-Actions/.github/actions/checkout@dev
      with:
        repository: ${{ inputs.source-repository }}
        ref: ${{ steps.find-branches.outputs.first-branch-name }}
        token: ${{ inputs.source-token }}
        fetch-depth: 0

    - name: Fetch branches and push to destination repository
      if: steps.find-branches.outputs.first-branch-name != ''
      shell: pwsh
      run: |
        $refNames = '${{ steps.find-branches.outputs.branch-names }}' -split ', ' |
          ForEach-Object { $PSItem -like 'refs/heads/*' ? $PSItem : "refs/heads/$PSItem" }

        # Fetch branches from source repository. If the repository is checked out in this action, then we know for sure
        # that the first branch is already fetched.
        $fetchRefNames = '${{ inputs.checkout }}' -eq 'true' ? $refNames[1..($refNames.Count - 1)] : $refNames
        $fetchRefNames | ForEach-Object { git fetch origin "$($PSItem):$($PSItem)" }

        # Removing extra authentication header that interferes with the PAT: https://stackoverflow.com/a/69979203
        git config --unset-all http.https://github.com/.extraheader

        git remote add destination 'https://${{ inputs.destination-token }}@github.com/${{ inputs.destination-repository }}'

        $refNames | ForEach-Object { git push destination "$($PSItem):$($PSItem)" }

    - name: Delete 'destination' remote
      if: (success() || failure()) && steps.find-branches.outputs.first-branch-name != ''
      shell: bash
      run: git remote rm destination
